<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام إدارة الكشافة - مدرسة القديس يوسف بالعبور</title>
    <meta name="description" content="برنامج محلي آمن لإدارة بيانات عضوات وقادة الكشافة وقاعدة بيانات SQLite بدون إنترنت" />
    <meta property="og:title" content="نظام إدارة الكشافة - مدرسة القديس يوسف بالعبور" />
    <meta property="og:description" content="برنامج محلي آمن لإدارة بيانات عضوات وقادة الكشافة وقاعدة بيانات SQLite بدون إنترنت" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous" />
    <style>
      body {
        font-family: 'Cairo', 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      @media print {
        .no-print {
          display: none !important;
        }
        .print-only {
          display: block !important;
        }
        body {
          background: white !important;
          color: black !important;
        }
      }
    </style>
    <script>
      // Suppress benign Vite HMR websocket disconnection notices in cloud sandbox preview
      (function() {
        const origConsoleError = console.error;
        console.error = function (...args) {
          const msg = args.map(function(a) {
            return (a && (a.message || a.stack || String(a))) || '';
          }).join(' ');
          if (
            msg.includes('failed to connect to websocket') ||
            (msg.includes('[vite]') && msg.includes('websocket')) ||
            msg.includes('WebSocket closed without opened')
          ) {
            return;
          }
          origConsoleError.apply(console, args);
        };
      })();

      window.addEventListener('unhandledrejection', function (event) {
        if (
          event.reason &&
          (typeof event.reason === 'string' || event.reason.message) &&
          (String(event.reason.message || event.reason).includes('WebSocket') ||
           String(event.reason.message || event.reason).includes('websocket'))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (event) {
        if (
          event.message &&
          (event.message.includes('WebSocket') || event.message.includes('websocket'))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      // Immediate theme initialization to prevent flash
      try {
        const savedTheme = localStorage.getItem('scout_theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased font-sans transition-colors">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
